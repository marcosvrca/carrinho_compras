<!DOCTYPE html>
<html th:replace="~{fragmentos/layout :: layout(~{::head}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">

<!-- HEAD -->
<head th:replace="~{fragmentos/head :: head(~{})}"></head>

<!-- MAIN -->
<main class="container mt-4">

    <h2 class="mb-4">🛒 Carrinho de Compras</h2>

    <div th:if="${carrinho.itens.isEmpty()}">
        <div class="alert alert-warning" role="alert">
            Seu carrinho está vazio.
        </div>
    </div>

    <div th:if="${!carrinho.itens.isEmpty()}">
        <table class="table table-dark table-striped table-hover">
            <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço Unitário</th>
                <th>Preço Total</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item, itemStat : ${carrinho.itens}">
                <td th:text="${item.produto.descricao}"></td>
                <td>
                    <form th:action="@{/produtos/atualizar-carrinho}" method="post" style="display: inline;">
                        <input type="hidden" name="produtoId" th:value="${item.produto.id}" />
                        <input type="number" name="quantidade" th:value="${item.quantidade}" min="0" class="form-control" style="width: 80px;" onchange="this.form.submit();"/>
                    </form>
                </td>
                <td th:text="${#numbers.formatCurrency(item.produto.valor)}"></td>
                <td th:text="${#numbers.formatCurrency(item.produto.valor * item.quantidade)}"></td>
                <td>
                    <a th:href="@{'/produtos/remover-do-carrinho/' + ${item.produto.id}}" class="btn btn-danger btn-sm">Remover</a>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="d-flex justify-content-end mt-4">
            <div class="text-end">
                <h4>Total: <span class="text-warning" th:text="${#numbers.formatCurrency(carrinho.valorTotal)}"></span></h4>
                <a href="/vendas/finalizar" class="btn btn-primary mt-3">Finalizar Compra</a>
            </div>
        </div>
    </div>

    <a href="/produtos" class="btn btn-secondary mt-3">Continuar Comprando</a>

</main>

</html>
