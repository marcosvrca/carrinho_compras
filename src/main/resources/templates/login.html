<!DOCTYPE html>
<html th:replace="~{fragmentos/layout-auth :: layout(~{::head}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/head :: head(~{})}"></head>

<main class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h1 class="text-center" style="color: white;">Login</h1>
                </div>
                <div class="card-body">
                    <div th:if="${param.error}" class="alert alert-danger">
                        Usuário ou senha inválidos.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success">
                        Você foi desconectado.
                    </div>
                    <form th:action="@{/login}" method="post">
                        <div class="form-group mb-3">
                            <label for="username" style="color: white;">Nome de Usuário</label>
                            <input type="text" id="username" name="username" class="form-control" placeholder="Digite seu nome de usuário" required autofocus>
                        </div>
                        <div class="form-group mb-3">
                            <label for="password" style="color: white;">Senha</label>
                            <input type="password" id="password" name="password" class="form-control" placeholder="Digite sua senha" required>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Entrar</button>
                        </div>
                    </form>
                    <div class="text-center mt-3">
                        <p style="color: white;">Não tem uma conta? <a th:href="@{/clientes/novo}" style="color: white;">Registre-se aqui</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</html>
