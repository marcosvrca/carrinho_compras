<!DOCTYPE html>
<html th:replace="~{fragmentos/layout :: layout(~{::head},~{::main})}"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/head :: head(~{})}"></head>

<body>

<main class="container mt-5">

    <h2 class="mb-4">📋 Lista de Vendas</h2>

    <a href="/vendas/novo" class="btn btn-success mb-3">➕ Nova Venda</a>
    <a href="/clientes/novo" class="btn btn-success mb-3">➕ Novo Cliente</a>
    <form class="row g-3 mb-4" th:action="@{/vendas/filtrar}" method="get">

      <!--  <div class="col-md-4">
            <label for="nomeCliente" class="form-label">Cliente</label>
            <input type="text" id="nomeCliente" name="nomeCliente" class="form-control"
                   placeholder="Buscar por nome ou razão social..."
                   th:value="${nomeCliente}">
        </div> -->

        <div class="col-md-4">
            <label for="inicio" class="form-label">Data Inicial</label>
            <input type="date" id="inicio" name="inicio" class="form-control"
                   th:value="${inicio}">
        </div>

        <div class="col-md-4">
            <label for="fim" class="form-label">Data Final</label>
            <input type="date" id="fim" name="fim" class="form-control"
                   th:value="${fim}">
        </div>

        <div class="col-md-4 align-self-end">
            <button type="submit" class="btn btn-primary w-100">🔍 Filtrar</button>
        </div>
    </form>

    <a href="/vendas" class="btn btn-secondary mb-3" th:if="${filtroAtivo}">❌ Limpar Filtro</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Data</th>
            <th>Cliente</th>
            <th>Total (R$)</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="venda : ${vendas}">
            <td th:text="${venda.id}"></td>
            <td th:text="${#temporals.format(venda.data, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${venda.cliente.getNome()}"></td>
            <td th:text="${#numbers.formatDecimal(venda.total(), 2, 'POINT', 2, 'COMMA')}"></td>
            <td>
                <a th:href="@{'/vendas/' + ${venda.id}}" class="btn btn-primary btn-sm">🔍 Detalhes</a>
            </td>
        </tr>
        </tbody>
    </table>

</main>

</body>
</html>
