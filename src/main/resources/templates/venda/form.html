<!DOCTYPE html>
<html th:replace="~{fragmentos/layout :: layout(~{::head},~{::main})}"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/head :: head(~{::title})}">
    <title>Nova Venda</title>
</head>

<main class="container mt-5">

    <h2 class="mb-4">🛒 Nova Venda</h2>

    <!-- ÚNICO FORMULARIO PARA A VENDA -->
    <form th:action="@{/vendas/salvar}" th:object="${venda}" method="post">

        <input type="hidden" th:field="*{id}"/>

        <!-- Cliente -->
        <div class="mb-3">
            <label class="form-label">Cliente</label>
            <select class="form-select" name="clienteId" required>
                <option value="">Selecione um cliente</option>
                <option th:each="c : ${clientes}"
                        th:value="${c.id}"
                        th:text="${c.identificacao}"
                        th:selected="${venda.cliente != null && venda.cliente.id == c.id}">
                </option>
            </select>
        </div>

        <!-- Data -->
        <div class="mb-3">
            <label class="form-label">Data da Venda</label>
            <input type="datetime-local" th:field="*{data}" class="form-control">
        </div>

        <hr>
        <h4>Itens da Venda</h4>

        <!-- ADD ITEM (SEM JS) -->
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label class="form-label">Produto</label>
                <select class="form-select" name="produtoId" >
                    <option value="">Selecione</option>
                    <option th:each="p : ${produtos}"
                            th:value="${p.id}"
                            th:text="${p.descricao}">
                    </option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label">Quantidade</label>
                <input type="number" min="1" step="1" name="quantidade"
                       value="1" class="form-control" required>
            </div>

            <div class="col-md-3 d-flex align-items-end">
                <!-- Ao clicar aqui, envia ESTE MESMO FORM para /vendas/addItem -->
                <button type="submit"
                        class="btn btn-primary w-100"
                        formaction="/vendas/addItem"
                        formmethod="post">
                    ➕ Adicionar
                </button>
            </div>
        </div>

        <!-- LISTA DE ITENS -->
        <table class="table table-bordered">
            <thead class="table-light">
            <tr>
                <th>Produto</th>
                <th>Qtd</th>
                <th>Total</th>
                <th>Ação</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="i, iter : ${venda.itens}">
                <td th:text="${i.produto.descricao}"></td>
                <td th:text="${i.quantidade}"></td>
                <td th:text="${#numbers.formatDecimal(i.total(),1,2)}"></td>
                <td>
                    <a th:href="@{/vendas/removeItem(index=${iter.index})}"
                       class="btn btn-danger btn-sm">Remover</a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(venda.itens)}">
                <td colspan="4" class="text-center text-muted">Nenhum item ainda.</td>
            </tr>
            </tbody>
        </table>

        <button type="submit" class="btn btn-success">💾 Salvar Venda</button>
        <a th:href="@{/vendas}" class="btn btn-secondary">Cancelar</a>

    </form>

</main>
</html>
