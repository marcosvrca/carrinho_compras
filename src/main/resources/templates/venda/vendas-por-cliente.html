<!DOCTYPE html>
<html th:replace="~{fragmentos/layout :: layout(~{::head}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/head :: head(~{})}"></head>

<main class="container mt-4">

    <h2 class="mb-4">Vendas para o Cliente: <span th:text="${cliente.identificacao}"></span></h2>

    <!-- form filtro -->
    <form th:action="@{'/vendas/cliente/' + ${cliente.id}}" method="get" class="mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <label for="inicio" class="form-label">Data Início</label>
                <input type="date" id="inicio" name="inicio" class="form-control" th:value="${inicio}">
            </div>
            <div class="col-md-4">
                <label for="fim" class="form-label">Data Fim</label>
                <input type="date" id="fim" name="fim" class="form-control" th:value="${fim}">
            </div>
            <div class="col-md-4">
                <button type="submit" class="btn btn-primary">Filtrar</button>
                <a th:href="@{'/vendas/cliente/' + ${cliente.id}}" class="btn btn-secondary">Limpar Filtro</a>
            </div>
        </div>
    </form>


    <div th:if="${vendas.isEmpty()}">
        <p>Nenhuma venda encontrada para este cliente.</p>
    </div>

    <div th:if="${!vendas.isEmpty()}">
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
            <tr>
                <th>ID da Venda</th>
                <th>Data da Venda</th>
                <th>Total da Venda</th>
                <th>Itens</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="venda : ${vendas}">
                <td th:text="${venda.id}"></td>
                <td th:text="${#temporals.format(venda.data, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${#numbers.formatDecimal(venda.total(), 2, 'COMMA', 2, 'POINT')}"></td>
                <td>
                    <ul>
                        <li th:each="item : ${venda.itens}">
                            <span th:text="${item.produto.descricao}"></span> -
                            <span th:text="${item.quantidade}"></span> x
                            <span th:text="${#numbers.formatDecimal(item.produto.valor, 2, 'COMMA', 2, 'POINT')}"></span>
                        </li>
                    </ul>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <a href="/clientes" class="btn btn-secondary mt-3">⬅️ Voltar para Clientes</a>

</main>

</html>
