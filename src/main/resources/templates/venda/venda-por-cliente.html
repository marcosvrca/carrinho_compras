<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragmentos/layout :: layout(~{::head},~{::main})}">

<head th:replace="~{fragmentos/head :: head(~{})}">
    <title>Vendas do Cliente</title>
</head>

<body>
<main class="container mt-5">

    <h2 class="mb-4">📊 Vendas de <span th:text="${cliente.identificacao}"></span></h2>

    <form class="row g-3 mb-4">
        <div class="col-md-4">
            <label for="inicio" class="form-label">Data Inicial</label>
            <input type="date" id="inicio" name="inicio" class="form-control" th:value="${inicio}">
        </div>

        <div class="col-md-4">
            <label for="fim" class="form-label">Data Final</label>
            <input type="date" id="fim" name="fim" class="form-control" th:value="${fim}">
        </div>

        <div class="col-md-4 align-self-end">
            <button type="submit" class="btn btn-primary w-100">🔍 Filtrar</button>
        </div>
    </form>

    <a th:href="@{/clientes}" class="btn btn-secondary mb-3">⬅ Voltar para Clientes</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Data</th>
            <th>Total (R$)</th>
            <th>Detalhes</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="venda : ${vendas}">
            <td th:text="${venda.id}"></td>
            <td th:text="${#temporals.format(venda.data, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${#numbers.formatDecimal(venda.total(), 2, 'POINT', 2, 'COMMA')}"></td>
            <td>
                <a th:href="@{'/vendas/' + ${venda.id}}" class="btn btn-sm btn-info">🔍 Ver Detalhes</a>
            </td>
        </tr>
        </tbody>
    </table>

</main>
</body>
</html>
