<header class="container"
        th:fragment="header"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark rounded-2 mb-4">
        <div class="container-fluid">

            <!-- Logo -->
            <a class="navbar-brand" th:href="@{/}">Info Mix</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <!-- LADO ESQUERDO -->
                <ul class="navbar-nav me-auto">

                    <!-- VISÍVEL PARA TODOS -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/produtos}">Produtos</a>
                    </li>

                    <!-- SOMENTE ADMIN -->
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/clientes}">Clientes</a>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/vendas}">Vendas</a>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/produtos/config}">
                            Configurações de Produtos
                        </a>
                    </li>

                    <!-- USER E ADMIN -->
                    <li class="nav-item" sec:authorize="hasAnyRole('USER','ADMIN')">
                        <a class="nav-link" th:href="@{/vendas/minhas-compras}">
                            Minhas Compras
                        </a>
                    </li>
                </ul>

                <!-- SEARCH -->
                <form class="d-flex mx-auto w-50" th:action="@{/produtos}" method="get">
                    <input class="form-control me-2"
                           type="search"
                           name="q"
                           placeholder="Buscar produtos, marcas e categorias">
                    <button class="btn btn-warning" type="submit">
                        🔍
                    </button>
                </form>

                <!-- LADO DIREITO -->
                <ul class="navbar-nav ms-auto">

                    <!-- NÃO LOGADO -->
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/login}">Login</a>
                    </li>

                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/clientes/novo}">
                            Cadastrar
                        </a>
                    </li>

                    <!-- LOGADO -->
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/logout}">
                            Logout
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
</header>
