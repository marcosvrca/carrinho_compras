<header th:fragment="header"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm w-100">

        <div class="container-fluid px-4">

            <!-- LOGO -->
            <a class="navbar-brand fw-bold" th:href="@{/}">
                Info Mix
            </a>

            <!-- BOTÃO MOBILE -->
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <!-- LADO ESQUERDO -->
                <ul class="navbar-nav me-lg-3">

                    <!-- VISÍVEL PARA TODOS -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/produtos}">Produtos</a>
                    </li>

                    <!-- SOMENTE ADMIN -->
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/clientes}">Clientes</a>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/vendas}">Vendas</a>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/produtos/config}">
                            Configurações
                        </a>
                    </li>

                    <!-- USER E ADMIN -->
                    <li class="nav-item" sec:authorize="hasAnyRole('USER','ADMIN')">
                        <a class="nav-link" th:href="@{/vendas/minhas-compras}">
                            Minhas Compras
                        </a>
                    </li>
                </ul>

                <!-- SEARCH (RESPONSIVO) -->
                <form class="d-flex flex-grow-1 mx-lg-4 my-2 my-lg-0"
                      th:action="@{/produtos}"
                      method="get">

                    <input class="form-control me-2"
                           type="search"
                           name="nome"
                           th:value="${nome}"
                           placeholder="Buscar produtos...">

                    <button class="btn btn-warning" type="submit">
                        🔍
                    </button>
                </form>

                <!-- LADO DIREITO -->
                <ul class="navbar-nav ms-lg-auto">

                    <!-- NÃO LOGADO -->
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/login}">Login</a>
                    </li>

                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/clientes/novo}">
                            Cadastrar
                        </a>
                    </li>

                    <!-- LOGADO -->
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/logout}">
                            Logout
                        </a>
                    </li>

                    <!-- CARRINHO (sempre visível) -->
                    <li class="nav-item">
                        <a class="btn btn-success btn-sm"
                           th:href="@{/produtos/carrinho}">
                            🛒 Carrinho <span id="cart-item-count" class="badge bg-light text-dark">0</span>
                        </a>
                    </li>

                    <!-- MINHAS COMPRAS (USER autenticado, não ADMIN) -->
                    <li class="nav-item"
                        sec:authorize="isAuthenticated() and !hasRole('ADMIN')">
                        <a class="btn btn-info btn-sm"
                           th:href="@{/vendas/minhas-compras}">
                            Minhas Compras
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
</header>
