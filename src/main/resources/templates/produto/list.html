<!DOCTYPE html>
<html th:replace="~{fragmentos/layout :: layout(~{::head}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragmentos/head :: head(~{})}"></head>

<main class="container mt-4">

    <h2 class="mb-4">Produtos da Loja</h2>

    <div class="row">
        <!-- Sidebar de Departamentos -->
                <div class="col-md-3">
                    <div class="card bg-dark text-white mb-4">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            Departamentos
                            <button class="btn btn-sm btn-outline-light" type="button" data-bs-toggle="collapse"
                                    data-bs-target="#departamentosCollapse" aria-expanded="false"
                                    aria-controls="departamentosCollapse">
                                <span class="bi bi-chevron-down"></span>
                            </button>
                        </div>
                        <div class="collapse" id="departamentosCollapse" th:classappend="${departamentoId != null} ? 'show' : ''">
                            <ul class="list-group list-group-flush">
                                <li class="list-group-item bg-dark text-white"
                                    th:classappend="${departamentoId == null} ? 'active' : ''">
                                    <a th:href="@{/produtos(nome=${nome})}" class="text-decoration-none"
                                       th:classappend="${departamentoId == null} ? 'text-primary' : 'text-white'">Todos</a>
                                </li>
                                <li class="list-group-item bg-dark text-white" th:each="dep : ${departamentos}"
                                    th:classappend="${departamentoId == dep.id} ? 'active' : ''">
                                    <a th:href="@{/produtos(departamentoId=${dep.id}, nome=${nome})}" class="text-decoration-none"
                                       th:classappend="${departamentoId == dep.id} ? 'text-primary' : 'text-white'"
                                       th:text="${dep.nome}"></a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
        <!-- Listagem de Produtos -->
        <div class="col-md-9">
            <form th:action="@{/produtos}" method="get" class="mb-4">
                <div class="input-group">
                    <input type="hidden" name="departamentoId" th:value="${departamentoId}">
                    <input type="text" name="nome" class="form-control" placeholder="Filtrar por nome do produto" th:value="${nome}">
                    <button type="submit" class="btn btn-primary">Filtrar</button>
                    <a th:href="@{/produtos(departamentoId=${departamentoId})}" class="btn btn-secondary">Limpar</a>
                </div>
            </form>

            <div th:if="${produtos.isEmpty()}">
                <div class="alert alert-info">
                    Nenhum produto encontrado para este departamento.
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-4" th:each="p : ${produtos}">
                    <div class="card h-100">
                        <img th:src="${p.imageUrl}" class="card-img-top" alt="Imagem do Produto" style="height: 200px; object-fit: cover;">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title" th:text="${p.descricao}"></h5>
                            <p class="card-text fw-bold fs-5" th:text="${#numbers.formatCurrency(p.valor)}"></p>
                            <div class="mt-auto">
                                <form class="add-to-cart-form" th:action="@{/produtos/adicionar-ao-carrinho}" method="post">
                                    <input type="hidden" name="produtoId" th:value="${p.id}" />
                                    <input type="hidden" name="quantidade" value="1" />
                                    <button type="submit" class="btn btn-primary w-100">Adicionar ao Carrinho</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Paginação -->
            <nav aria-label="Page navigation" th:if="${totalPages > 1}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/produtos(page=${currentPage - 1}, size=${pageSize}, nome=${nome}, departamentoId=${departamentoId})}">Anterior</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/produtos(page=${i}, size=${pageSize}, nome=${nome}, departamentoId=${departamentoId})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/produtos(page=${currentPage + 1}, size=${pageSize}, nome=${nome}, departamentoId=${departamentoId})}">Próximo</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

</main>

</html>
