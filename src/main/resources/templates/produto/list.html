<!DOCTYPE html>
<html th:replace="~{fragmentos/layout :: layout(~{::head}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragmentos/head :: head(~{})}"></head>

<main class="container mt-4">

    <h2 class="mb-4">Produtos da Loja</h2>

   <!--
   <a href="/produtos/carrinho" class="btn btn-success mb-3">🛒 Ver Carrinho</a>
    <a href="/vendas/minhas-compras" class="btn btn-info mb-3" sec:authorize="isAuthenticated() and !hasAuthority('ROLE_ADMIN')">Minhas Compras</a>

   <form th:action="@{/produtos}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="nome" class="form-control" placeholder="Filtrar por nome do produto" th:value="${nome}">
            <button type="submit" class="btn btn-outline-primary">Filtrar</button>
            <a th:href="@{/produtos}" class="btn btn-outline-secondary">Limpar</a>
        </div>
    </form>
    -->

    <div class="row">
        <div class="col-md-3 mb-3" th:each="p : ${produtos}">
            <div class="card">
                <img th:src="${p.imageUrl}" class="card-img-top" alt="Imagem do Produto" style="height: 150px; object-fit: cover;">
                <div class="card-body">
                    <h5 class="card-title" th:text="${p.descricao}"></h5>
                    <p class="card-text" th:text="${#numbers.formatDecimal(p.valor, 2, 'COMMA', 2, 'POINT')}"></p>
                    <div class="d-flex justify-content-between align-items-center">
                        <form class="add-to-cart-form" th:action="@{/produtos/adicionar-ao-carrinho}" method="post" style="display: inline;">
                            <input type="hidden" name="produtoId" th:value="${p.id}" />
                            <div class="input-group">
                                <input type="number" name="quantidade" value="1" min="1" class="form-control" style="width: 60px;">
                                <button type="submit" class="btn btn-primary">Add</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</main>

</html>
