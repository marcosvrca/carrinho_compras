<!DOCTYPE html>
<html th:replace="~{fragmentos/layout :: layout(~{::head}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragmentos/head :: head(~{})}"></head>

<main class="container mt-4">

    <h2 class="mb-4">Departamentos</h2>

    <a href="/departamentos/novo" class="btn btn-primary mb-3">Novo Departamento</a>

    <form th:action="@{/departamentos}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="nome" class="form-control" placeholder="Filtrar por nome do departamento" th:value="${nome}">
            <button type="submit" class="btn btn-outline-primary">Filtrar</button>
            <a th:href="@{/departamentos}" class="btn btn-outline-secondary">Limpar</a>
        </div>
    </form>

    <div th:if="${departamentos.isEmpty()}">
        <div class="alert alert-info">
            Nenhum departamento encontrado.
        </div>
    </div>

    <div th:if="${!departamentos.isEmpty()}">
        <table class="table table-dark table-striped table-hover">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="departamento : ${departamentos}">
                <td th:text="${departamento.id}"></td>
                <td th:text="${departamento.nome}"></td>
                <td th:text="${departamento.descricao}"></td>
                <td>
                    <a th:href="@{'/departamentos/editar/' + ${departamento.id}}" class="btn btn-primary btn-sm">Editar</a>
                    <a th:href="@{'/departamentos/excluir/' + ${departamento.id}}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Tem certeza que deseja excluir este departamento?');">Excluir</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</main>

</html>
